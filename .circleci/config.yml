version: 2.1

orbs:
  node: circleci/node@7.2.1
  android: circleci/android@3.2.0

executors:
  javascript:
    docker:
      - image: cimg/node:24.22.1

commands:
  install_dependencies:
    steps:
      # Dependencies with native binaries must be installed on each OS.
      - restore_cache:
          keys:
            - dependencies-v2-{{ arch }}-{{ checksum "yarn.lock" }}-{{ checksum "example/yarn.lock" }}
      - run:
          name: Install dependencies
          command: |
            yarn install --cwd example --frozen-lockfile
            yarn install --frozen-lockfile
      - save_cache:
          key: dependencies-v2-{{ arch }}-{{ checksum "yarn.lock" }}-{{ checksum "example/yarn.lock" }}
          paths: [node_modules, example/node_modules]

jobs:
  lint:
    executor: javascript
    steps:
      - checkout
      - install_dependencies
      - run: yarn lint

  typescript:
    executor: javascript
    steps:
      - checkout
      - install_dependencies
      - run:
          name: Typecheck library and example
          command: |
            yarn typescript
            yarn example tsc --noEmit

  test:
    executor: javascript
    steps:
      - checkout
      - install_dependencies
      - run:
          name: Unit tests and package build
          command: |
            yarn test --runInBand
            yarn example test --runInBand
            yarn bob build

  e2e-ios:
    macos:
      xcode: '26.4.1'
    resource_class: m4pro.medium
    steps:
      - checkout
      - node/install:
          node-version: '24.22.1'
          install-yarn: true
          yarn-version: '1.22.22'
      - install_dependencies
      - run:
          name: Install iOS test dependencies
          command: |
            brew tap wix/brew
            brew install applesimutils
            # Restored node_modules can skip Detox's postinstall on a fresh VM.
            yarn detox build-framework-cache
            cd example
            bundle install
            cd ios
            bundle exec pod install
      - run:
          name: Test Swift package integration
          command: BUNDLE_GEMFILE=example/Gemfile bundle exec ruby scripts/test/stripe_identity_spm_test.rb
      - run:
          name: Build for Detox
          command: yarn e2e:build:ios:release
      - run:
          name: Run Detox
          command: yarn e2e:test:ios:release
      - store_artifacts:
          path: ./artifacts

  e2e-android:
    executor:
      name: android/android_machine
      tag: '2026.10.1'
      resource_class: large
    steps:
      - checkout
      - node/install:
          node-version: '24.22.1'
          install-yarn: true
          yarn-version: '1.22.22'
      - android/change_java_version:
          java_version: 17
      - install_dependencies
      - android/accept_licenses
      - android/start_emulator_and_run_tests:
          avd_name: TestingAVD
          system_image: system-images;android-36;google_apis;x86_64
          post_emulator_launch_assemble_command: yarn e2e:build:android:release
          test_command: yarn e2e:test:android:release
          max_tries: 1
          no_output_timeout: 60m
      - store_artifacts:
          path: ./artifacts

workflows:
  build-and-test:
    jobs:
      - lint
      - typescript
      - test
      - e2e-android
      - e2e-ios
